name: Deploy 내가왕
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: imking-pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - name: Install the initial source upload
        shell: bash
        run: |
          if [ -f imking-source.zip ]; then
            unzip -o imking-source.zip -x '.github/*'
            rm imking-source.zip
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add .
            git commit -m 'Install the complete Imking game source'
            git push
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm test
      - name: Read Pages address
        id: pages
        uses: actions/configure-pages@v5
      - name: Build game
        run: npm run build
        env:
          SITE_URL: ${{ steps.pages.outputs.base_url }}
          SUPABASE_PROJECT_REF: ytxbpwwvawozksosgprk
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish game
        id: deployment
        uses: actions/deploy-pages@v4
